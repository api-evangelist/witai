aid: witai
name: Wit.AI
description: >-
  Wit.ai is a natural language processing (NLP) platform from Meta that lets
  developers build applications and devices you can talk or text to. It turns
  spoken or written user input into structured, machine-readable data —
  extracting intents, entities, and traits — and provides speech recognition
  (speech-to-text), dictation, and speech synthesis (text-to-speech).
  Developers train an app with example utterances, then call the Wit HTTP API
  with a Bearer server access token to parse messages, transcribe audio, and
  manage an app's entities, intents, traits, and utterances. Wit.ai is free to
  use and ships official client SDKs for Node.js, Python, Ruby, Go, iOS, Unity,
  and Unreal. It was founded in 2013, backed by a16z, and acquired by Facebook
  (now Meta) in 2015.
