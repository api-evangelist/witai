apis:
- name: Wit.ai HTTP API
  description: >-
    The Wit.ai HTTP API extracts structured meaning (intents, entities, traits)
    from text and audio, transcribes speech (speech / dictation), synthesizes
    speech (text-to-speech), and manages an app's NLP model (entities, intents,
    traits, utterances, apps, export/import). Authenticated with a Bearer server
    access token and versioned by date (current: 20240304).
